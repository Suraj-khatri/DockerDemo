services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "manager@123"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 1 bash -c '</dev/tcp/localhost/1433' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    working_dir: /src
    command:
      [
        "dotnet",
        "ef",
        "database",
        "update",
        "--verbose"
      ]
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DockerDemo;User Id=sa;Password=manager@123;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      target: final
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DockerDemo;User Id=sa;Password=manager@123;TrustServerCertificate=True;
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sql_data:
